name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build -- --base=/God-s-Eye-View-La-Guajira-/

      - name: Normalize Cesium output
        run: |
          NESTED="dist/God-s-Eye-View-La-Guajira-/cesium"
          if [ -d "$NESTED" ]; then
            rm -rf dist/cesium
            mv "$NESTED" dist/cesium
            rmdir dist/God-s-Eye-View-La-Guajira- || true
          fi
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Validate static build
        run: |
          test -f dist/index.html
          test -f dist/logo.svg
          test -f dist/cesium/Cesium.js
          test -d dist/assets
          grep -q '/God-s-Eye-View-La-Guajira-/assets/' dist/index.html
          grep -q '/God-s-Eye-View-La-Guajira-/cesium/Cesium.js' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
