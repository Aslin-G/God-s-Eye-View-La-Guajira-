name: Build GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for repository Pages path
        run: npm run build -- --base=/God-s-Eye-View-La-Guajira-/

      - name: Normalize Cesium output for GitHub Pages
        run: |
          NESTED="dist/God-s-Eye-View-La-Guajira-/cesium"
          if [ -d "$NESTED" ]; then
            rm -rf dist/cesium
            mv "$NESTED" dist/cesium
            rmdir dist/God-s-Eye-View-La-Guajira- || true
          fi

      - name: Validate static build
        run: |
          test -f dist/index.html
          test -f dist/logo.svg
          test -f dist/cesium/Cesium.js
          test -d dist/assets
          grep -q '/God-s-Eye-View-La-Guajira-/assets/' dist/index.html
          grep -q '/God-s-Eye-View-La-Guajira-/cesium/Cesium.js' dist/index.html

      - name: Stage clean static site outside the repository
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          rm -rf /tmp/gev-pages
          mkdir -p /tmp/gev-pages
          cp -R dist/. /tmp/gev-pages/

      - name: Publish only static build to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-deploy
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/gev-pages/. .
          git add -A
          git commit -m "Deploy GitHub Pages site"
          git push --force origin HEAD:gh-pages
