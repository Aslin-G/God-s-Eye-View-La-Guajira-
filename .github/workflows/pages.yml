name: Build GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for repository Pages path
        run: npm run build -- --base=/God-s-Eye-View-La-Guajira-/

      - name: Prepare static site
        run: |
          touch dist/.nojekyll
          cp -R dist /tmp/gev-pages

      - name: Publish dist to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-deploy
          git rm -rf .
          cp -R /tmp/gev-pages/. .
          git add -A
          git commit -m "Deploy GitHub Pages site"
          git push --force origin HEAD:gh-pages
